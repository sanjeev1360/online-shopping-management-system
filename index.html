
<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping Management System</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .product {
            background: white;
            width: 200px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 5px gray;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #218838;
        }

        .cart {
            background: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        .remove {
            background-color: red;
        }
    </style>
</head>

<body>

<header>
    <h1>Online Shopping Management System</h1>
    <p>Welcome to Online Shopping</p>
</header>

<h2>Available Products</h2>

<div class="products">

    <div class="product">
        <h3>Laptop</h3>
        <p>Price: ₹45000</p>
        <button onclick="addToCart('Laptop',45000)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Mobile</h3>
        <p>Price: ₹15000</p>
        <button onclick="addToCart('Mobile',15000)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Headphones</h3>
        <p>Price: ₹1500</p>
        <button onclick="addToCart('Headphones',1500)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Keyboard</h3>
        <p>Price: ₹800</p>
        <button onclick="addToCart('Keyboard',800)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Mouse</h3>
        <p>Price: ₹500</p>
        <button onclick="addToCart('Mouse',500)">
            Add to Cart
        </button>
    </div>

</div>

<div class="cart">
    <h2>Shopping Cart</h2>

    <div id="cartItems">
        Cart is empty
    </div>

    <h3>Total: ₹<span id="total">0</span></h3>

    <button onclick="checkout()">Checkout</button>
</div>

<script>
    let cart = [];

    function addToCart(name, price) {
        let item = cart.find(p => p.name === name);

        if (item) {
            item.quantity++;
        } else {
            cart.push({
                name: name,
                price: price,
                quantity: 1
            });
        }

        displayCart();
    }

    function displayCart() {
        let output = "";
        let total = 0;

        if (cart.length === 0) {
            document.getElementById("cartItems").innerHTML =
                "Cart is empty";
        } else {
            cart.forEach((item, index) => {
                let amount = item.price * item.quantity;
                total += amount;

                output += `
                    <p>
                        ${item.name} -
                        ₹${item.price} x ${item.quantity}
                        = ₹${amount}
                        <button class="remove"
                        onclick="removeItem(${index})">
                        Remove</button>
                    </p>
                `;
            });

            document.getElementById("cartItems").innerHTML = output;
        }

        document.getElementById("total").innerText = total;
    }

    function removeItem(index) {
        cart.splice(index, 1);
        displayCart();
    }

    function checkout() {
        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        let name = prompt("Enter your name:");

        if (!name || !name.trim()) {
            alert("Please enter your name.");
            return;
        }

        let total = cart.reduce(
            (sum, item) => sum + item.price * item.quantity, 0
        );

        alert(
            "Order Placed Successfully!\n" +
            "Customer: " + name + "\n" +
            "Total Amount: ₹" + total
        );

        cart = [];
        displayCart();
    }
</script>

</body>
</html>
